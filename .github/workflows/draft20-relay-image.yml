# Builds the PIM harness relay image from the exact commit at the head of the
# release branch. Point the branch at a reviewed head; the image is pinned by
# the digest in the run summary, never by tag.
name: Publish draft-20 PIM relay image

on:
  push:
    branches:
      - release/blo-46109-draft20-relay-image

permissions:
  contents: read

env:
  IMAGE: registry.blockcast.net/blockcast/pim-multicast-gateway/moq-relay-ietf-pim

jobs:
  build-push-verify:
    runs-on: default
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.blockcast.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: pim-relay
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:draft20-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}

      - name: Pull by digest and verify
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          REF="$IMAGE@$DIGEST"
          docker pull --platform linux/amd64 "$REF"
          test "$(docker image inspect "$REF" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker run --rm "$REF" --help | grep -q -- --http-port
          # moq-lite is a different protocol: the relay must refuse it at startup.
          if docker run --rm "$REF" --protocols ietf-wt,moq-lite; then
            echo "::error::relay accepted moq-lite"; exit 1
          fi
          {
            echo "## Published draft-20 PIM relay image"
            echo
            echo "- Digest: \`$REF\`"
            echo "- Source: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
