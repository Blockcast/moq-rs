name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: default
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # This standalone checkout is both the built source and its owning root,
      # so both provenance labels identify the exact main commit being deployed.
      - run: >-
          flyctl deploy --remote-only
          --build-arg SOURCE_REVISION=${{ github.sha }}
          --build-arg BASE_REVISION=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
